<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>保険料推移グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 10px; font-size: 14px; }
        #controls { 
            margin-bottom: 10px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            max-height: 120px; /* 高さを抑えてコンパクトに */
            overflow-y: auto; 
            background: #f9f9f9;
        }
        .checkbox-item { display: inline-block; margin-right: 12px; white-space: nowrap; }
        /* グラフの親要素の高さを1/3程度に制限 */
        .chart-container {
            position: relative;
            height: 30vh; /* 画面の高さの約1/3 */
            width: 95vw;
        }
    </style>
</head>
<body>

    <h3 style="margin: 5px 0;">保険料推移グラフ</h3>

    <div id="controls">
        <strong>表示項目：</strong>
        <div id="checkboxes">読み込み中...</div>
    </div>

    <div class="chart-container">
        <canvas id="insuranceChart"></canvas>
    </div>

    <script>
        let rawData = [];
        const labels = ["0歳", "1歳", "2歳", "3歳", "4歳", "5歳", "6歳", "7歳", "8歳", "9歳", "10歳", "11歳", "12歳", "13歳", "14歳", "15歳", "16歳"];
        let chart;

        // GASからデータを取得
        window.onload = function() {
            google.script.run.withSuccessHandler(setupData).getInsuranceData();
        };

        function setupData(data) {
            rawData = data;
            const container = document.getElementById('checkboxes');
            container.innerHTML = '';
            
            rawData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = 'cb' + index;
                cb.value = index;
                cb.checked = (index < 3); // 最初は3つだけ表示
                cb.onchange = updateChart;
                
                const label = document.createElement('label');
                label.htmlFor = 'cb' + index;
                label.textContent = item.name;
                
                div.appendChild(cb);
                div.appendChild(label);
                container.appendChild(div);
            });
            createChart();
        }

        function createChart() {
            const ctx = document.getElementById('insuranceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // コンテナの高さに合わせる
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: { font: { size: 10 } } 
                        },
                        x: { ticks: { font: { size: 10 } } }
                    },
                    plugins: {
                        legend: { labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
            updateChart();
        }

        function updateChart() {
            const selected = [];
            document.querySelectorAll('#checkboxes input:checked').forEach(cb => {
                const idx = cb.value;
                selected.push({
                    label: rawData[idx].name,
                    data: rawData[idx].values,
                    borderColor: `hsl(${(idx * 137.5) % 360}, 70%, 50%)`,
                    backgroundColor: `hsl(${(idx * 137.5) % 360}, 70%, 50%)`,
                    borderWidth: 2,
                    pointRadius: 2,
                    tension: 0.2
                });
            });
            chart.data.datasets = selected;
            chart.update();
        }
    </script>
</body>
</html>
