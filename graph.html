<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保険料推移グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 10px; font-size: 16px; color: #333; }
        h3 { margin: 5px 0 10px 0; font-size: 18px; }

        #controls { 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            max-height: 140px; 
            overflow-y: auto; 
            background: #fdfdfd;
            border-radius: 4px;
        }

        /* 項目を中間サイズに調整 */
        .checkbox-item { 
            display: inline-flex;
            align-items: center;
            margin: 3px 6px 3px 0;
            padding: 4px 10px; /* 余白を半分に */
            background: #f0f0f0;
            border-radius: 15px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        
        /* チェックボックスを中間サイズ(18px)に */
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
        }

        .checkbox-item span {
            font-size: 15px; /* 読みやすい中間サイズ */
            font-weight: 500;
        }

        .chart-container { 
            position: relative; 
            height: 35vh; /* 画面の約1/3に固定 */
            width: 100%; 
        }
    </style>
</head>
<body>
    <h3>📊 保険料推移グラフ</h3>
    
    <div id="controls">
        <div id="checkboxes">データを読み込み中...</div>
    </div>

    <div class="chart-container">
        <canvas id="insuranceChart"></canvas>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSwgCvHlDl6YtpEX9b1n_nNYQU-i0FVhoE7U90dHXe_q9cbJjUmZSMpxTZtDTwqRO7UBrElKMZCSP2a/pub?gid=1826550484&single=true&output=csv';

        let rawData = [];
        const labels = ["0歳", "1歳", "2歳", "3歳", "4歳", "5歳", "6歳", "7歳", "8歳", "9歳", "10歳", "11歳", "12歳", "13歳", "14歳", "15歳", "16歳"];
        let chart;

        async function loadCsv() {
            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
                
                rawData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        name: cols[2]?.replace(/"/g, ''),
                        values: cols.slice(34, 51).map(v => {
                            const num = parseFloat(v.replace(/[",]/g, ''));
                            return isNaN(num) ? null : num;
                        })
                    };
                }).filter(item => item.name);

                setupCheckboxes();
            } catch (e) {
                document.getElementById('checkboxes').innerText = "エラー";
            }
        }

        function setupCheckboxes() {
            const container = document.getElementById('checkboxes');
            container.innerHTML = '';
            rawData.forEach((item, index) => {
                const labelWrapper = document.createElement('label');
                labelWrapper.className = 'checkbox-item';
                const checked = index === 0 ? 'checked' : '';
                labelWrapper.innerHTML = `<input type="checkbox" id="cb${index}" value="${index}" ${checked} onchange="updateChart()"><span>${item.name}</span>`;
                container.appendChild(labelWrapper);
            });
            createChart();
        }

        function createChart() {
            const ctx = document.getElementById('insuranceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { 
                        y: { ticks: { font: { size: 12 } } },
                        x: { ticks: { font: { size: 12 } } }
                    },
                    plugins: {
                        legend: { labels: { font: { size: 12 }, boxWidth: 15 } }
                    }
                }
            });
            updateChart();
        }

        function updateChart() {
            const selected = [];
            document.querySelectorAll('#checkboxes input:checked').forEach(cb => {
                const idx = cb.value;
                selected.push({
                    label: rawData[idx].name,
                    data: rawData[idx].values,
                    borderColor: `hsl(${(idx * 137.5) % 360}, 70%, 50%)`,
                    borderWidth: 2,
                    pointRadius: 3,
                    tension: 0.1,
                    spanGaps: true
                });
            });
            chart.data.datasets = selected;
            chart.update();
        }
        loadCsv();
    </script>
</body>
</html>
