<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保険料推移グラフ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全体の基本設定 */
        body { font-family: sans-serif; margin: 15px; font-size: 18px; line-height: 1.5; }
        h3 { margin: 10px 0; font-size: 22px; }

        /* 項目選択エリア（見やすく、スクロールしやすく） */
        #controls { 
            margin-bottom: 20px; 
            border: 2px solid #ddd; 
            padding: 15px; 
            max-height: 180px; 
            overflow-y: auto; 
            background: #fff;
            border-radius: 8px;
        }

        /* チェックボックスとラベルのセット（押しやすいボタン風） */
        .checkbox-item { 
            display: inline-flex;
            align-items: center;
            margin: 5px 10px 5px 0;
            padding: 8px 12px;
            background: #eee;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .checkbox-item:hover { background: #e0e0e0; }
        
        /* 本物のチェックボックスを少し大きく */
        .checkbox-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            cursor: pointer;
        }

        /* ラベルの文字を大きく */
        .checkbox-item label {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* グラフエリア（高さは控えめ、横幅いっぱい） */
        .chart-container { 
            position: relative; 
            height: 40vh; /* 画面の約40% */
            width: 100%; 
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h3>📊 保険料推移グラフ</h3>
    
    <div id="controls">
        <div style="margin-bottom: 10px;"><strong>表示したい項目をタップしてください：</strong></div>
        <div id="checkboxes">データを読み込み中...</div>
    </div>

    <div class="chart-container">
        <canvas id="insuranceChart"></canvas>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSwgCvHlDl6YtpEX9b1n_nNYQU-i0FVhoE7U90dHXe_q9cbJjUmZSMpxTZtDTwqRO7UBrElKMZCSP2a/pub?gid=1826550484&single=true&output=csv';

        let rawData = [];
        const labels = ["0歳", "1歳", "2歳", "3歳", "4歳", "5歳", "6歳", "7歳", "8歳", "9歳", "10歳", "11歳", "12歳", "13歳", "14歳", "15歳", "16歳"];
        let chart;

        async function loadCsv() {
            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
                
                rawData = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        name: cols[2]?.replace(/"/g, ''),
                        values: cols.slice(34, 51).map(v => {
                            const num = parseFloat(v.replace(/[",]/g, ''));
                            return isNaN(num) ? null : num;
                        })
                    };
                }).filter(item => item.name);

                setupCheckboxes();
            } catch (e) {
                document.getElementById('checkboxes').innerText = "読み込みエラーが発生しました。";
            }
        }

        function setupCheckboxes() {
            const container = document.getElementById('checkboxes');
            container.innerHTML = '';
            
            rawData.forEach((item, index) => {
                const labelWrapper = document.createElement('label');
                labelWrapper.className = 'checkbox-item';
                
                const checked = index === 0 ? 'checked' : '';
                labelWrapper.innerHTML = `
                    <input type="checkbox" id="cb${index}" value="${index}" ${checked} onchange="updateChart()">
                    <span>${item.name}</span>
                `;
                container.appendChild(labelWrapper);
            });
            createChart();
        }

        function createChart() {
            const ctx = document.getElementById('insuranceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { 
                        y: { 
                            beginAtZero: true,
                            ticks: { font: { size: 14 } } // 軸の目盛りも大きく
                        },
                        x: {
                            ticks: { font: { size: 14 } }
                        }
                    },
                    plugins: {
                        legend: { 
                            position: 'top', 
                            labels: { font: { size: 14 }, boxWidth: 20 } 
                        }
                    }
                }
            });
            updateChart();
        }

        function updateChart() {
            const selected = [];
            document.querySelectorAll('#checkboxes input:checked').forEach(cb => {
                const idx = cb.value;
                selected.push({
                    label: rawData[idx].name,
                    data: rawData[idx].values,
                    borderColor: `hsl(${(idx * 137.5) % 360}, 70%, 50%)`,
                    backgroundColor: `hsl(${(idx * 137.5) % 360}, 70%, 50%)`,
                    borderWidth: 3,
                    pointRadius: 4,
                    tension: 0.1,
                    spanGaps: true
                });
            });
            chart.data.datasets = selected;
            chart.update();
        }

        loadCsv();
    </script>
</body>
</html>
