<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>保険総支払比較</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  input {
    width: 80px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #f5f5f5;
  }
  .big {
    font-size: 1.3em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>保険 総支払シミュレーション</h2>

<h3>ユーザー入力</h3>
<div>
  保険開始年齢(P列):
  <input id="startAge" type="number" value="5">
</div>

<div>
  通院回数(AZ): <input id="visitCount" type="number" value="0">
  通院費用(BA): <input id="visitCost" type="number" value="0">
</div>

<div>
  検査回数(BB): <input id="testCount" type="number" value="0">
  検査費用(BC): <input id="testCost" type="number" value="0">
</div>

<div>
  入院回数(BD): <input id="stayCount" type="number" value="0">
  入院費用(BE): <input id="stayCost" type="number" value="0">
</div>

<div>
  手術回数(BF): <input id="surgeryCount" type="number" value="0">
  手術費用(BG): <input id="surgeryCost" type="number" value="0">
</div>

<button onclick="calculate()">計算する</button>

<table id="resultTable">
  <thead>
    <tr>
      <th>保険名(C)</th>
      <th>自己負担合計(BM)</th>
      <th>生涯保険料合計(AY)</th>
      <th>総支払合計</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/14QjmJBnhg9wGDs7_-M2BkMacN-tLvYaLVx7QJtixq-M/gviz/tq?tqx=out:csv&sheet=plans";

let plans = [];

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    const rows = text.trim().split("\n").map(r =>
      r.split(",").map(v => v.replace(/"/g, ""))
    );
    const header = rows.shift();
    plans = rows.map(r => {
      const o = {};
      header.forEach((h, i) => o[h] = r[i]);
      return o;
    });
  });

function calculate() {
  const startAge = Number(startAgeInput.value);
  const visitCount = Number(visitCountInput.value);
  const visitCost = Number(visitCostInput.value);
  const testCount = Number(testCountInput.value);
  const testCost = Number(testCostInput.value);
  const stayCount = Number(stayCountInput.value);
  const stayCost = Number(stayCostInput.value);
  const surgeryCount = Number(surgeryCountInput.value);
  const surgeryCost = Number(surgeryCostInput.value);

  const results = plans.map(p => {
    // AY列：Total self-payment
    let premiumSum = 0;
    for (let age = startAge; age <= 16; age++) {
      premiumSum += Number(p["Total self-payment"] || 0);
    }

    const rate = Number(p["Compensation rate"]) / 100;
    const deductible = Number(p["Disclaimer"]);

    const visitSelf =
      Math.max(0, visitCost * visitCount * (1 - rate) + deductible);
    const testSelf =
      Math.max(0, testCost * testCount * (1 - rate) + deductible);
    const staySelf =
      Math.max(0, stayCost * stayCount * (1 - rate) + deductible);
    const surgerySelf =
      Math.max(0, surgeryCost * surgeryCount * (1 - rate) + deductible);

    const selfTotal = visitSelf + testSelf + staySelf + surgerySelf;
    const grandTotal = premiumSum + selfTotal;

    return {
      name: p["Insurance name & percentage"],
      premiumSum,
      selfTotal,
      grandTotal
    };
  });

  results.sort((a, b) => a.grandTotal - b.grandTotal);
  render(results);
}

function render(list) {
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";
  list.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="big">${r.name}</td>
      <td class="big">${r.selfTotal.toLocaleString()}</td>
      <td>${r.premiumSum.toLocaleString()}</td>
      <td>${r.grandTotal.toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

// input shortcut
const startAgeInput = document.getElementById("startAge");
const visitCountInput = document.getElementById("visitCount");
const visitCostInput = document.getElementById("visitCost");
const testCountInput = document.getElementById("testCount");
const testCostInput = document.getElementById("testCost");
const stayCountInput = document.getElementById("stayCount");
const stayCostInput = document.getElementById("stayCost");
const surgeryCountInput = document.getElementById("surgeryCount");
const surgeryCostInput = document.getElementById("surgeryCost");
</script>

</body>

</html>
