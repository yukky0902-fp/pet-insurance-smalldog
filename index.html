<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>保険総支払比較</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  input {
    width: 80px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #f5f5f5;
  }
  .big {
    font-size: 1.3em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>保険 総支払シミュレーション</h2>

<h3>ユーザー入力</h3>
<div>
  保険開始年齢(P列):
  <input id="startAge" type="number" value="5">
</div>

<div>
  通院回数(AZ): <input id="visitCount" type="number" value="0">
  通院費用(BA): <input id="visitCost" type="number" value="0">
</div>

<div>
  検査回数(BB): <input id="testCount" type="number" value="0">
  検査費用(BC): <input id="testCost" type="number" value="0">
</div>

<div>
  入院回数(BD): <input id="stayCount" type="number" value="0">
  入院費用(BE): <input id="stayCost" type="number" value="0">
</div>

<div>
  手術回数(BF): <input id="surgeryCount" type="number" value="0">
  手術費用(BG): <input id="surgeryCost" type="number" value="0">
</div>

<button onclick="calculate()">計算する</button>

<table id="resultTable">
  <thead>
    <tr>
      <th>保険名(C)</th>
      <th>自己負担合計(BM)</th>
      <th>生涯保険料合計(AY)</th>
      <th>総支払合計</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/14QjmJBnhg9wGDs7_-M2BkMacN-tLvYaLVx7QJtixq-M/gviz/tq?tqx=out:csv&sheet=plans";

let plans = [];

// 文字列からカンマ等を除去して数値に変換する関数
function parseNum(val) {
  if (!val) return 0;
  // カンマ、％、円などの記号を削除して数値化
  const num = Number(val.replace(/[^-0-9.]/g, ""));
  return isNaN(num) ? 0 : num;
}

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    // CSVを正しく分割する正規表現（カンマ区切りだが引用符内は無視）
    const rows = text.trim().split(/\r?\n/).map(row => {
      return row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g)?.map(v => v.replace(/"/g, "")) || [];
    });
    
    const header = rows.shift();
    plans = rows.map(r => {
      const o = {};
      header.forEach((h, i) => o[h] = r[i]);
      return o;
    });
    console.log("Loaded plans:", plans); // デバッグ用
  });

function calculate() {
  const startAge = Number(startAgeInput.value);
  const vCount = Number(visitCountInput.value);
  const vCost = Number(visitCostInput.value);
  const tCount = Number(testCountInput.value);
  const tCost = Number(testCostInput.value);
  const sCount = Number(stayCountInput.value);
  const sCost = Number(stayCostInput.value);
  const surCount = Number(surgeryCountInput.value);
  const surCost = Number(surgeryCostInput.value);

  const results = plans.map(p => {
    // 1. 生涯保険料の計算（AY列: Annual_premium_total を参照していると想定）
    // 注意: スプレッドシートの列名が "Total_self-payment" で合っているか確認してください
    let premiumSum = 0;
    const annualPremium = parseNum(p["Annual_premium_total"] || p["Total_self-payment"] || "0");
    for (let age = startAge; age <= 16; age++) {
      premiumSum += annualPremium;
    }

    // 2. 自己負担額の計算
    const rate = parseNum(p["Compensation-rate"]) / 100;
    const deductible = parseNum(p["Disclaimer"]);

    const visitSelf = Math.max(0, vCost * vCount * (1 - rate) + (vCount > 0 ? deductible : 0));
    const testSelf = Math.max(0, tCost * tCount * (1 - rate) + (tCount > 0 ? deductible : 0));
    const staySelf = Math.max(0, sCost * sCount * (1 - rate) + (sCount > 0 ? deductible : 0));
    const surgerySelf = Math.max(0, surCost * surCount * (1 - rate) + (surCount > 0 ? deductible : 0));

    const selfTotal = visitSelf + testSelf + staySelf + surgerySelf;
    const grandTotal = premiumSum + selfTotal;

    return {
      name: p["Insurance name&percentage"],
      premiumSum,
      selfTotal,
      grandTotal
    };
  });

  // NaNを除外してソート
  const filteredResults = results.filter(r => !isNaN(r.grandTotal));
  filteredResults.sort((a, b) => a.grandTotal - b.grandTotal);
  render(filteredResults);
}

function render(list) {
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";
  list.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="big">${r.name || '不明'}</td>
      <td class="big">${Math.floor(r.selfTotal).toLocaleString()}円</td>
      <td>${Math.floor(r.premiumSum).toLocaleString()}円</td>
      <td style="font-weight:bold; color:red;">${Math.floor(r.grandTotal).toLocaleString()}円</td>
    `;
    tbody.appendChild(tr);
  });
}

// input shortcut（以下省略、既存のままでOK）
</script>

</body>

</html>
