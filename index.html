<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>保険総支払比較</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  input {
    width: 80px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #f5f5f5;
  }
  .big {
    font-size: 1.3em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>保険 総支払シミュレーション</h2>

<h3>ユーザー入力</h3>
<div>
  保険開始年齢(P列):
  <input id="startAge" type="number" value="5">
</div>

<div>
  通院回数(AZ): <input id="visitCount" type="number" value="0">
  通院費用(BA): <input id="visitCost" type="number" value="0">
</div>

<div>
  検査回数(BB): <input id="testCount" type="number" value="0">
  検査費用(BC): <input id="testCost" type="number" value="0">
</div>

<div>
  入院回数(BD): <input id="stayCount" type="number" value="0">
  入院費用(BE): <input id="stayCost" type="number" value="0">
</div>

<div>
  手術回数(BF): <input id="surgeryCount" type="number" value="0">
  手術費用(BG): <input id="surgeryCost" type="number" value="0">
</div>

<button onclick="calculate()">計算する</button>

<table id="resultTable">
  <thead>
    <tr>
      <th>保険名(C)</th>
      <th>自己負担合計(BM)</th>
      <th>生涯保険料合計(AY)</th>
      <th>総支払合計</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/14QjmJBnhg9wGDs7_-M2BkMacN-tLvYaLVx7QJtixq-M/gviz/tq?tqx=out:csv&sheet=plans";

let plans = [];

// 文字列から記号を除去して数値に変換する関数
function parseNum(val) {
  if (val === undefined || val === null || val === "") return 0;
  const num = Number(String(val).replace(/[^-0-9.]/g, ""));
  return isNaN(num) ? 0 : num;
}

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    // CSVを正しく分割（引用符内のカンマを無視）
    const rows = text.trim().split(/\r?\n/).map(row => {
      const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      return matches ? matches.map(v => v.replace(/^"|"$/g, "").trim()) : [];
    });
    
    // ヘッダーの空白などをクリーンアップ
    const header = rows.shift().map(h => h.trim());
    
    plans = rows.map(r => {
      const o = {};
      header.forEach((h, i) => {
        o[h] = r[i];
      });
      return o;
    });
    console.log("読み込み完了。ヘッダー一覧:", header); 
    console.log("データ1件目:", plans[0]);
  });

function calculate() {
  const startAge = Number(document.getElementById("startAge").value);
  const vCount = Number(document.getElementById("visitCount").value);
  const vCost = Number(document.getElementById("visitCost").value);
  const tCount = Number(document.getElementById("testCount").value);
  const tCost = Number(document.getElementById("testCost").value);
  const sCount = Number(document.getElementById("stayCount").value);
  const sCost = Number(document.getElementById("stayCost").value);
  const surCount = Number(document.getElementById("surgeryCount").value);
  const surCost = Number(document.getElementById("surgeryCost").value);

  const results = plans.map(p => {
    // スプレッドシートの正確な列名に合わせる（トリミング済み）
    const name = p["Insurance name&percentage"] || p["Insurance name"] || "不明";
    
    // 生涯保険料（AY列: Annual_premium_total）
    let premiumSum = 0;
    const annualPremium = parseNum(p["Annual_premium_total"]);
    for (let age = startAge; age <= 16; age++) {
      premiumSum += annualPremium;
    }

    // 自己負担額の計算（Compensation-rate, Disclaimer）
    const rateVal = p["Compensation-rate"];
    const rate = parseNum(rateVal) / 100;
    const deductible = parseNum(p["Disclaimer"]);

    // 計算ロジック
    const visitSelf = Math.max(0, vCost * vCount * (1 - rate) + (vCount > 0 ? deductible : 0));
    const testSelf = Math.max(0, tCost * tCount * (1 - rate) + (tCount > 0 ? deductible : 0));
    const staySelf = Math.max(0, sCost * sCount * (1 - rate) + (sCount > 0 ? deductible : 0));
    const surgerySelf = Math.max(0, surCost * surCount * (1 - rate) + (surCount > 0 ? deductible : 0));

    const selfTotal = visitSelf + testSelf + staySelf + surgerySelf;
    const grandTotal = premiumSum + selfTotal;

    return {
      name: name,
      premiumSum,
      selfTotal,
      grandTotal
    };
  });

  // 計算不能なものを除外して安い順にソート
  const filteredResults = results.filter(r => r.name !== "不明");
  filteredResults.sort((a, b) => a.grandTotal - b.grandTotal);
  render(filteredResults);
}

function render(list) {
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";
  list.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="big" style="text-align:left;">${r.name}</td>
      <td class="big">${Math.floor(r.selfTotal).toLocaleString()}</td>
      <td>${Math.floor(r.premiumSum).toLocaleString()}</td>
      <td style="font-weight:bold; color:red;">${Math.floor(r.grandTotal).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>

</html>
