<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>保険総支払比較</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  input {
    width: 80px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #f5f5f5;
  }
  .big {
    font-size: 1.3em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>保険 総支払シミュレーション</h2>

<h3>ユーザー入力</h3>
<div>
  保険開始年齢(P列):
  <input id="startAge" type="number" value="5">
</div>

<div>
  通院回数(AZ): <input id="visitCount" type="number" value="0">
  通院費用(BA): <input id="visitCost" type="number" value="0">
</div>

<div>
  検査回数(BB): <input id="testCount" type="number" value="0">
  検査費用(BC): <input id="testCost" type="number" value="0">
</div>

<div>
  入院回数(BD): <input id="stayCount" type="number" value="0">
  入院費用(BE): <input id="stayCost" type="number" value="0">
</div>

<div>
  手術回数(BF): <input id="surgeryCount" type="number" value="0">
  手術費用(BG): <input id="surgeryCost" type="number" value="0">
</div>

<button onclick="calculate()">計算する</button>

<table id="resultTable">
  <thead>
    <tr>
      <th>保険名(C)</th>
      <th>自己負担合計(BM)</th>
      <th>生涯保険料合計(AY)</th>
      <th>総支払合計</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/14QjmJBnhg9wGDs7_-M2BkMacN-tLvYaLVx7QJtixq-M/gviz/tq?tqx=out:csv&sheet=plans";

let plans = [];

// 文字列からカンマや記号を消して数値にする関数
function parseNum(val) {
  if (val === undefined || val === null || val === "") return 0;
  // 数字、マイナス、ドット以外をすべて削除
  const num = Number(String(val).replace(/[^-0-9.]/g, ""));
  return isNaN(num) ? 0 : num;
}

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    // CSVをパース（カンマ区切り、引用符考慮）
    const rows = text.trim().split(/\r?\n/).map(row => {
      const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      return matches ? matches.map(v => v.replace(/^"|"$/g, "").trim()) : [];
    });
    
    // 1行目（ヘッダー）を飛ばしてデータを入れる
    rows.shift(); 
    plans = rows; 
    console.log("データの読み込みに成功しました。行数:", plans.length);
  });

function calculate() {
  const startAge = Number(document.getElementById("startAge").value);
  const vCount = Number(document.getElementById("visitCount").value);
  const vCost = Number(document.getElementById("visitCost").value);
  const tCount = Number(document.getElementById("testCount").value);
  const tCost = Number(document.getElementById("testCost").value);
  const sCount = Number(document.getElementById("stayCount").value);
  const sCost = Number(document.getElementById("stayCost").value);
  const surCount = Number(document.getElementById("surgeryCount").value);
  const surCost = Number(document.getElementById("surgeryCost").value);

  if (plans.length === 0) {
    alert("データがまだ読み込まれていません。少し待ってから再度お試しください。");
    return;
  }

  const results = plans.map(p => {
    // 列番号（0から数えて）で直接指定します
    // C列(保険名) = index 2
    // AY列(保険料合計) = index 50
    // BN列(補償率) = index 65 (スプレッドシートの列位置に合わせて要確認)
    // BO列(免責) = index 66
    
    const name = p[2] || "不明";
    const annualPremium = parseNum(p[50]); // AY列付近
    const rate = parseNum(p[65]) / 100;    // BN列付近
    const deductible = parseNum(p[66]);    // BO列付近

    // 生涯保険料計算（現在の設定：16歳まで一律）
    let premiumSum = 0;
    for (let age = startAge; age <= 16; age++) {
      premiumSum += annualPremium;
    }

    // 自己負担計算
    const calcSelf = (count, cost) => Math.max(0, (cost * count * (1 - rate)) + (count > 0 ? deductible : 0));

    const selfTotal = calcSelf(vCount, vCost) + 
                      calcSelf(tCount, tCost) + 
                      calcSelf(sCount, sCost) + 
                      calcSelf(surCount, surCost);
                      
    const grandTotal = premiumSum + selfTotal;

    return { name, premiumSum, selfTotal, grandTotal };
  });

  // 合計金額が有効なものだけを表示し、安い順に並び替え
  const filtered = results.filter(r => r.name !== "不明" && !isNaN(r.grandTotal));
  filtered.sort((a, b) => a.grandTotal - b.grandTotal);
  
  render(filtered);
}

function render(list) {
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";
  
  if (list.length === 0) {
    tbody.innerHTML = "<tr><td colspan='4'>該当するデータがありません</td></tr>";
    return;
  }

  list.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="big" style="text-align:left;">${r.name}</td>
      <td class="big">${Math.floor(r.selfTotal).toLocaleString()}</td>
      <td>${Math.floor(r.premiumSum).toLocaleString()}</td>
      <td style="font-weight:bold; color:red;">${Math.floor(r.grandTotal).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>

</html>
